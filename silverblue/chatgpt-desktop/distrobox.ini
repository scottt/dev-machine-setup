# Distrobox manifest for the ChatGPT Desktop container.
# The image is built locally from ./Containerfile (see chatgpt-desktop-install).
# `exported_apps` places a launcher entry in the host GNOME app grid.
[chatgpt]
image=localhost/chatgpt-desktop:latest
pull=false
exported_apps="/usr/local/share/applications/chatgpt-gui.desktop"
